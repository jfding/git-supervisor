# Supervisor deployments config (sample).
# Copy to deployments.yaml and edit. Run: supervisor check --config deployments.yaml

defaults:
  dir_base: /srv/git-supervisor/work
  branches: [main, master]  # default for hosts that don't set branches per repo
  log-level: 2  # optional; passed to remote check-push.sh as LOGLEVEL

# Define repos once (git_url only); hosts reference them by name and set branches per host/repo.
repos:
  git-supervisor:
    git_url: git@github.com:org/git-supervisor.git
  webapp:
    git_url: git@github.com:org/webapp.git

hosts:
  # Local testing: localhost targets run directly (no local SSH daemon needed)
  local:
    ssh_target: localhost
    repos: []

  # Remote host with default dir_base and one repo (uses defaults.branches)
  app-server:
    ssh_target: deploy@app-server.example.com
    repos: [webapp]

  # Host with managed SSH key (looked up in ~/.config/git-supervisor/keys/ then ~/.ssh/)
  staging-server:
    ssh_target: deploy@staging.example.com
    ssh_key_name: staging_deploy_key

  # Host with explicit SSH key path, port, dir_base, release_count, release tag patterns, and per-repo branches
  devops-server:
    ssh_target: ops@devops-server.ai
    ssh_port: 2222
    ssh_identity_file: ~/.ssh/deploy_key
    # ssh_key_name: deploy_key  # alternative: use managed key (takes precedence over ssh_identity_file)

    release_count: 6        # optional, default 4
    # release_tag_pattern: "^v[0-9Q.]+$"       # optional; passed as RELEASE_TAG_PATTERN
    # release_tag_exclude_pattern: "^v0\\."   # optional; passed as RELEASE_TAG_EXCLUDE_PATTERN

    dir_base: /srv/auto-reloader/work
    repos:
      - name: git-supervisor
        branches: [main, dev]
      - name: webapp
        branches: [main, release]

  # Host using SSH agent forwarding for GitHub access.
  # The controller's SSH agent is forwarded (ssh -A) so the remote host can clone/fetch
  # from GitHub without any key stored on the remote machine.
  # Prerequisite: the GitHub key must be loaded in the controller's agent beforehand:
  #   ssh-add ~/.ssh/github_key
  agent-forward-server:
    ssh_target: deploy@agent-forward.example.com
    ssh_forward_agent: true
    repos: [webapp]

  # Host with a pre-placed GitHub SSH key on the remote machine.
  # Use this when agent forwarding is not available (e.g. jump hosts, locked-down environments).
  # The key path is on the remote host; ~/... is expanded by the remote shell.
  static-key-server:
    ssh_target: deploy@static-key.example.com
    github_ssh_key: ~/.ssh/github_deploy_key  # path on the remote host
    repos: [webapp]
