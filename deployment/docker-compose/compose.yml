---

services:
    loader:
        restart: always
        image: rushiai/auto-reloader:v2.0.9
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /usr/bin/docker:/usr/bin/docker
            - ./work:/work
            - ./keys:/root/.ssh

        ports:
            - 9870:9870

        working_dir: /work

        # default: webhook mode on port 9870 (requires GITHUB_WEBHOOK_SECRET)
        # uncomment to run the shell script directly instead:
        #command: /scripts/check-push.sh

        # uncomment to run in polling-only mode (no webhook):
        #command: /git-supervisor watch --interval 120

        environment:
            - TZ=Asia/Shanghai
            - FORCE_COLOR=1
            - LOGLEVEL=2
               # default LOGLEVEL 2 means verbose (used by check-push.sh)
            - GITHUB_WEBHOOK_SECRET=1234567890
               # required for webhook mode (--webhook-port)
            #- TIMEOUT=120
               # default timeout for long-running git ops is 600s (check-push.sh only)
            #- SLEEP_TIME=360
               # polling interval in seconds for check-push.sh (use --interval for git-supervisor watch)
