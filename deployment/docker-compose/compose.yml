---

services:
    loader:
        restart: always
        image: rushiai/auto-reloader:v2.0.9
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /usr/bin/docker:/usr/bin/docker
            - ./work:/work
            - ./keys:/root/.ssh

        ports:
            - 9870:9870

        working_dir: /work

        # default: local mode (no config file needed), polls every 120s
        # DIR_BASE defaults to /work; git repos expected at /work/git_repos/
        #
        # uncomment to enable webhook mode (requires GITHUB_WEBHOOK_SECRET):
        #command: ["/git-supervisor", "watch", "--webhook-port", "9870"]
        #
        # uncomment to use a config file for remote hosts:
        #command: ["/git-supervisor", "watch", "-c", "/config/deployments.yaml"]

        environment:
            - TZ=Asia/Shanghai
            - FORCE_COLOR=1
            - LOGLEVEL=2
               # 0=quiet 1=info 2=verbose 3=debug
            - TIMER_INTERVAL=120
               # default 120 seconds
            #- DIR_BASE=/work
               # base dir for git_repos/ and copies/ (default: /work)
            #- BR_WHITELIST=main master dev test alpha
               # space-separated branch whitelist
            #- TIMEOUT=600
               # timeout in seconds for long-running git ops
            #- GITHUB_WEBHOOK_SECRET=changeme
               # required only when using --webhook-port
