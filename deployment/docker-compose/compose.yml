---

services:
    loader:
        restart: always
        image: rushiai/git-supervisor:v2.1.2
        volumes:

            # if need to handle git repos in localhost, uncomment these two lines
            #- /var/run/docker.sock:/var/run/docker.sock
            #- /usr/bin/docker:/usr/bin/docker

            # for git access in local
            - ./ssh_keys:/root/.ssh

            - ./work:/work

            # prepare this config file and mount to run in remote control mode
            # otherwise, local mode will be used (same as run check-push.sh directly)
            #- ./deployments.yaml:/work/deployments.yaml

        ports:
            - 9870:9870

        working_dir: /work

        # uncomment to enable webhook listener (requires GITHUB_WEBHOOK_SECRET)
        # ONLY for remote control mode:
        #command: ["/git-supervisor", "watch", "--webhook-port", "9870"]

        environment:
            - TZ=Asia/Shanghai
            - FORCE_COLOR=1

            # settings by ENV
            - LOGLEVEL=2
               # 0=quiet 1=info 2=verbose 3=debug
            - TIMER_INTERVAL=120
               # default 120 seconds
            #- DIR_BASE=/work
               # base dir for git_repos/ and copies/ (default: /work)
            #- BR_WHITELIST=main master dev test alpha
               # space-separated branch whitelist
            #- TIMEOUT=600
               # timeout in seconds for long-running git ops
            #- GITHUB_WEBHOOK_SECRET=changeme
               # required only when using --webhook-port
